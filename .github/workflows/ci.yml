name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      docuconf_go_ref:
        description: docuconf-go ref to test against (empty = .github/docuconf-go.ref)
        required: false
        default: ""
  # Nightly against docuconf-go main, to catch spec changes before a bump PR.
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: "17"
            spring-boot: "3.5.16"
          - java: "21"
            spring-boot: "3.5.16"
          - java: "21"
            spring-boot: "4.1.1"
    name: Java ${{ matrix.java }}, Spring Boot ${{ matrix.spring-boot }}
    steps:
      - uses: actions/checkout@v4

      # The contract meta-schema (spec/cue) and the conformance suite (conformance/cases.json) live in docuconf-go.
      - name: Pick the docuconf-go ref
        id: dcref
        env:
          EVENT: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.docuconf_go_ref }}
        run: |
          if [ "$EVENT" = schedule ]; then echo "ref=main" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_REF" ]; then echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
          else echo "ref=$(tr -d '[:space:]' < .github/docuconf-go.ref)" >> "$GITHUB_OUTPUT"; fi
      - name: Check out docuconf-go
        uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          path: docuconf-go
          ref: ${{ steps.dcref.outputs.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install cue
        run: go install cuelang.org/go/cmd/cue@v0.17.1

      # The docuconf-go-facing subset (conformance suite, cue vet of exported
      # contracts); docuconf-go's downstream workflow runs the same script.
      - name: Run scripts/conformance.sh
        run: scripts/conformance.sh
        env:
          DOCUCONF_GO_DIR: ${{ github.workspace }}/docuconf-go
      - name: Build and test
        run: mvn -B -ntp verify -Dspring-boot.version=${{ matrix.spring-boot }}
        env:
          DOCUCONF_SPEC_CUE: ${{ github.workspace }}/docuconf-go/spec/cue
          DOCUCONF_REQUIRE_VET: "1"
          # The shared conformance suite (SPEC section 12), run through the contract-first mode.
          DOCUCONF_CONFORMANCE: ${{ github.workspace }}/docuconf-go/conformance/cases.json
          DOCUCONF_REQUIRE_CONFORMANCE: "1"

      # The orders example (examples/orders), built by the step above as a module of the reactor.
      - name: "Example: the committed contract is the exported one"
        run: |
          cp examples/orders/target/classes/META-INF/docuconf/contract.cue examples/orders/contract.cue
          git diff --exit-code -- examples/orders/contract.cue

      - name: "Example: cue vet the contract"
        run: |
          work=$(mktemp -d)
          cp -r docuconf-go/spec/cue/cue.mod docuconf-go/spec/cue/contract "$work"/
          mkdir "$work/svc"
          cp examples/orders/contract.cue "$work/svc/"
          cd "$work" && "$(go env GOPATH)/bin/cue" vet -c ./svc

      - name: "Example: smoke test"
        run: examples/orders/smoke.sh

      - name: Check the release build (sources, javadoc) without signing
        if: matrix.java == '21' && matrix.spring-boot == '3.5.16'
        run: mvn -B -ntp -Prelease -DskipTests -Dgpg.skip package
