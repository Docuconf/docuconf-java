name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: "17"
            spring-boot: "3.5.16"
          - java: "21"
            spring-boot: "3.5.16"
          - java: "21"
            spring-boot: "4.1.1"
    name: Java ${{ matrix.java }}, Spring Boot ${{ matrix.spring-boot }}
    env:
      MAVEN_ARGS: -B -ntp
    steps:
      - uses: actions/checkout@v4

      # The contract meta-schema (spec/cue) and the conformance suite (conformance/cases.json) live in docuconf-go.
      - uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          path: docuconf-go

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install cue
        run: go install cuelang.org/go/cmd/cue@v0.17.1

      - name: Build and test
        run: mvn verify -Dspring-boot.version=${{ matrix.spring-boot }}
        env:
          DOCUCONF_SPEC_CUE: ${{ github.workspace }}/docuconf-go/spec/cue
          DOCUCONF_REQUIRE_VET: "1"
          # The shared conformance suite (SPEC section 12), run through the contract-first mode.
          DOCUCONF_CONFORMANCE: ${{ github.workspace }}/docuconf-go/conformance/cases.json
          DOCUCONF_REQUIRE_CONFORMANCE: "1"

      # README step 1: install the SDK from source, for the examples, which are ordinary user projects.
      - name: Install the SDK as the README says
        run: mvn install -DskipTests -Dspring-boot.version=${{ matrix.spring-boot }}

      # README steps 3 to 6, as written (mvn package, run, see an error, docuconf:export, mvn verify with the
      # contract check and the example's tests).
      - name: "Example: the README quickstart"
        run: examples/orders/quickstart.sh

      - name: "Example: Spring's configuration processor still runs next to docuconf's"
        run: test -f examples/orders/target/classes/META-INF/spring-configuration-metadata.json

      - name: "Example: cue vet the contract"
        run: |
          work=$(mktemp -d)
          cp -r docuconf-go/spec/cue/cue.mod docuconf-go/spec/cue/contract "$work"/
          mkdir "$work/svc"
          cp examples/orders/contract.cue "$work/svc/"
          cd "$work" && "$(go env GOPATH)/bin/cue" vet -c ./svc

      - name: "Example: smoke test"
        run: examples/orders/smoke.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # The README's Gradle setup: the same sources, the compileJava input and the contract tasks.
      - name: "Example: Gradle build and contract check"
        run: |
          gradle -p examples/orders-gradle check
          diff examples/orders/contract.cue examples/orders-gradle/contract.cue

      - name: Check the release build (sources, javadoc) without signing
        if: matrix.java == '21' && matrix.spring-boot == '3.5.16'
        run: mvn -Prelease -DskipTests -Dgpg.skip package
